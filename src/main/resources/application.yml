spring:
  application:
    name: HrAssistantBot
  datasource:
    url: jdbc:h2:file:~/chatmemory;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    openai:
      chat:
        options:
          stream-usage: true
      api-key: ${OPENAI_API_KEY}
    vectorstore:
        qdrant:
            host: localhost
            port: 6334
            collection-name: HR_POLICY_COLLECTION
            initialize-schema: true
            use-tls: false
  docker:
    compose:
      lifecycle-management: start_and_stop
      stop:
        command: down
        arguments:
          - --volumes



logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG

# this config is important inorder to log request and response related info